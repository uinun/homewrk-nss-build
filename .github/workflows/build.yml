name: Build OpenWrt NSS-EDMA HomeWRK


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-24.04


    env:

      OPENWRT_DIR: openwrt-nss-edma


    steps:


##################################################
# 1. Checkout
##################################################

    - name: Checkout repository

      uses: actions/checkout@v4



##################################################
# 2. Free disk space
##################################################

    - name: Free disk space

      run: |

        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/share/powershell

        df -h



##################################################
# 3. Install dependencies
##################################################

    - name: Install build dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          ack \
          antlr3 \
          asciidoc \
          autoconf \
          automake \
          autopoint \
          binutils \
          bison \
          build-essential \
          bzip2 \
          ccache \
          cmake \
          cpio \
          curl \
          device-tree-compiler \
          fastjar \
          flex \
          gawk \
          gettext \
          gcc-multilib \
          g++-multilib \
          git \
          gperf \
          haveged \
          help2man \
          intltool \
          libc6-dev-i386 \
          libelf-dev \
          libglib2.0-dev \
          libgmp3-dev \
          libltdl-dev \
          libmpc-dev \
          libmpfr-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libreadline-dev \
          libssl-dev \
          libtool \
          lrzsz \
          mkisofs \
          msmtp \
          nano \
          ninja-build \
          p7zip \
          p7zip-full \
          patch \
          pkgconf \
          python3 \
          python3-pip \
          python3-ply \
          python3-docutils \
          qemu-utils \
          rsync \
          srecord \
          squashfs-tools \
          subversion \
          swig \
          texinfo \
          u-boot-tools \
          upx-ucl \
          unzip \
          vim \
          wget \
          xmlto \
          xz-utils \
          zlib1g-dev



##################################################
# 4. Clone NSS-EDMA source
##################################################

    - name: Clone NSS-EDMA source

      run: |

        git clone \
          -b nss-edma-rework \
          https://github.com/JuliusBairaktaris/openwrt-nss-edma.git \
          $OPENWRT_DIR



##################################################
# 5. Add NSS feed
##################################################

    - name: Add NSS feed


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        cp feeds.conf.default feeds.conf


        echo \
        "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss" \
        >> feeds.conf



##################################################
# 6. Update feeds
##################################################

    - name: Update feeds


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        ./scripts/feeds update -a

        ./scripts/feeds install -a

        ./scripts/feeds list -r nss | grep -q qca-nss-drv && echo "nss feed OK"



##################################################
# 7. Apply HomeWRK config
##################################################

    - name: Apply HomeWRK diffconfig


      run: |

        cp homewrk-diffconfig \
        $OPENWRT_DIR/.config



##################################################
# 8. 加入首次启动配置
##################################################

    - name: Add uci defaults


      run: |


        mkdir -p \
        $OPENWRT_DIR/files/etc/uci-defaults


        cp files/etc/uci-defaults/* \
        $OPENWRT_DIR/files/etc/uci-defaults/


        chmod +x \
        $OPENWRT_DIR/files/etc/uci-defaults/*



##################################################
# 9. Generate configuration
##################################################

    - name: Generate configuration


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        make defconfig



##################################################
# 10. Check configuration
##################################################

    - name: Check NSS configuration


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        echo "===== TARGET ====="

        grep CONFIG_TARGET .config || true


        echo

        echo "===== NSS ====="

        grep qca-nss .config || true




##################################################
# 11. Download sources
##################################################

    - name: Download sources


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        make download -j$(nproc)



##################################################
# 12. Build firmware
##################################################

    - name: Build firmware


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        make -j4 V=s



##################################################
# 13. Show firmware
##################################################

    - name: Show firmware files


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        find bin/targets -type f



##################################################
# 14. Upload firmware
##################################################

    - name: Upload firmware


      uses: actions/upload-artifact@v4


      with:

        name: HomeWRK-NSS-EDMA-firmware


        path: |


          ${{ env.OPENWRT_DIR }}/bin/targets/**/*sysupgrade*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*factory*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*sha256*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*profiles*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*manifest*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*buildinfo*


        if-no-files-found: error

        retention-days: 30



##################################################
# 15. Upload failure info
##################################################

    - name: Upload failure info


      if: failure()


      uses: actions/upload-artifact@v4


      with:


        name: HomeWRK-build-debug


        path: |

          ${{ env.OPENWRT_DIR }}/.config
          ${{ env.OPENWRT_DIR }}/tmp


        if-no-files-found: ignore