name: Build OpenWrt NSS-EDMA HomeWRK


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-24.04


    env:

      OPENWRT_DIR: openwrt-nss-edma

      CCACHE_DIR: ~/.ccache


    steps:


##################################################
# 1. Checkout
##################################################

    - name: Checkout repository

      uses: actions/checkout@v4



##################################################
# 2. Free disk space
##################################################

    - name: Free disk space

      run: |

        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/dotnet

        df -h



##################################################
# 3. Install dependencies
##################################################

    - name: Install build dependencies

      run: |


        sudo apt update


        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-pip \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl \
          ccache \
          patch \
          perl \
          tar \
          xz-utils \
          zstd



##################################################
# 4. Enable ccache
##################################################

    - name: Setup ccache

      run: |


        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV


        ccache --set-config=max_size=5G

        ccache --zero-stats



##################################################
# 5. Cache OpenWrt
##################################################

    - name: Cache OpenWrt build

      uses: actions/cache@v4


      with:


        path: |

          ${{ env.OPENWRT_DIR }}/dl
          ${{ env.OPENWRT_DIR }}/staging_dir
          ${{ env.OPENWRT_DIR }}/build_dir
          ~/.ccache


        key: >

          openwrt-homewrk-

          ${{ runner.os }}-

          ${{ hashFiles(
          'homewrk-diffconfig',
          'files/**'
          ) }}


        restore-keys: |

          openwrt-homewrk-${{ runner.os }}-



##################################################
# 6. Clone NSS-EDMA source
##################################################

    - name: Clone NSS-EDMA source


      run: |


        git clone \
          -b nss-edma-rework \
          https://github.com/JuliusBairaktaris/openwrt-nss-edma.git \
          $OPENWRT_DIR





##################################################
# 7. Add NSS feed
##################################################

    - name: Add NSS feed


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |


        cp feeds.conf.default feeds.conf


        echo \
        "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss" \
        >> feeds.conf





##################################################
# 8. Update feeds
##################################################

    - name: Update feeds


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |


        ./scripts/feeds update -a


        ./scripts/feeds install -a





##################################################
# 9. Apply HomeWRK config
##################################################

    - name: Apply HomeWRK diffconfig


      run: |


        cp homewrk-diffconfig \
        $OPENWRT_DIR/.config





##################################################
# 10. Copy files overlay
##################################################

    - name: Install custom files


      run: |


        mkdir -p \
        $OPENWRT_DIR/files


        cp -a files/. \
        $OPENWRT_DIR/files/



##################################################
# 11. Generate config
##################################################

    - name: Generate configuration


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |


        make defconfig





##################################################
# 12. Check configuration
##################################################

    - name: Check NSS configuration


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |


        echo "===== TARGET ====="

        grep CONFIG_TARGET .config | grep -E \
        "qualcommax|ipq807x|homewrk"



        echo

        echo "===== ATH11K ====="

        grep ath11k .config || true



        echo

        echo "===== NSS ====="

        grep qca-nss .config || true



        echo

        echo "===== ECM ====="

        grep ecm .config || true



        echo

        echo "===== EDMA ====="

        grep -i edma .config || true





##################################################
# 13. Download sources
##################################################

    - name: Download sources


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |


        make download -j4 || \
        make download -j1 V=s





##################################################
# 14. Build firmware
##################################################

    - name: Build firmware


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |


        make -j4 V=s



##################################################
# 15. ccache statistics
##################################################

    - name: Show ccache


      run: |


        ccache --show-stats





##################################################
# 16. Show firmware
##################################################

    - name: Show firmware files


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |


        find bin/targets -type f





##################################################
# 17. Upload firmware
##################################################

    - name: Upload firmware


      uses: actions/upload-artifact@v4


      with:


        name: HomeWRK-NSS-EDMA-firmware


        path: |


          ${{ env.OPENWRT_DIR }}/bin/targets/**/*sysupgrade*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*factory*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*manifest*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*profiles*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*sha256*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*buildinfo*


        if-no-files-found: warn


        retention-days: 30





##################################################
# 18. Upload logs if failed
##################################################

    - name: Upload failure logs


      if: failure()


      uses: actions/upload-artifact@v4


      with:


        name: HomeWRK-build-debug


        path: |

          ${{ env.OPENWRT_DIR }}/.config
          ${{ env.OPENWRT_DIR }}/logs